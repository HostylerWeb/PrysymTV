# MediaMTX — production (host network; API on localhost:4000)
logLevel: info

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: yes
# WebRTC publishes Opus — mpegts only supports MPEG-4 Audio; use fmp4 for HLS fallback.
hlsVariant: fmp4
hlsSegmentDuration: 1s
hlsSegmentCount: 6

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcAllowOrigins:
  - PRYSYM_PUBLIC_ORIGIN
  - http://localhost:8081
  - http://127.0.0.1:8081
  - http://localhost:19006
  - http://127.0.0.1:19006
webrtcAdditionalHosts:
  - PRYSYM_PUBLIC_HOST
  - PRYSYM_PUBLIC_IP

api: yes
apiAddress: 127.0.0.1:9997

authMethod: http
authHTTPAddress: http://127.0.0.1:4000/api/v1/streams/mediamtx/auth

paths:
  ~^live/(.+)$:
    source: publisher
    runOnReady: 'curl -fsS -X POST -H "x-mediamtx-webhook-secret: PRYSYM_MEDIAMTX_WEBHOOK_SECRET" "http://127.0.0.1:4000/api/v1/streams/webhooks/ready?path=$MTX_PATH"'
    runOnNotReady: 'curl -fsS -X POST -H "x-mediamtx-webhook-secret: PRYSYM_MEDIAMTX_WEBHOOK_SECRET" "http://127.0.0.1:4000/api/v1/streams/webhooks/done?path=$MTX_PATH"'
