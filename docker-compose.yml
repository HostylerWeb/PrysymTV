# Local development only — do not use these credentials in production.
services:
  postgres:
    image: postgres:16-alpine
    container_name: prysymtv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prysym
      POSTGRES_PASSWORD: prysym_dev_password
      POSTGRES_DB: prysymtv
    ports:
      - "5433:5432"
    volumes:
      - prysymtv_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prysym -d prysymtv"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: prysymtv-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - prysymtv_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: prysymtv-mediamtx
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8888:8888"
    volumes:
      - ./infra/mediamtx.yml:/mediamtx.yml:ro
    command: ["/mediamtx.yml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  prysymtv_pg_data:
  prysymtv_redis_data:
